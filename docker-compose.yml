services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudledger}
      POSTGRES_USER: ${POSTGRES_USER:-cloudledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudledger}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cloudledger}
      DB_USERNAME: ${POSTGRES_USER:-cloudledger}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cloudledger}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres-data:

